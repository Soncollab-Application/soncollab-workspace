<header [ngClass]="{
          'bg-transparent': showVideoBackground && !isScrolled,
          'bg-black': !showVideoBackground || isScrolled
        }"
        class="navbar navbar-expand-lg fixed-top  px-0"
        data-sticky-element=""
>
  <div class="container">
    <!-- Mobile offcanvas menu toggler (Hamburger) -->
    <button aria-controls="navbarNav" aria-label="Toggle navigation" class="navbar-toggler me-3 me-lg-0" data-bs-target="#navbarNav"
            data-bs-toggle="offcanvas" type="button">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar brand (Logo) -->
    <a [routerLink]="['/']" aria-label="Soncollab Home"
       class="navbar-brand py-1 py-md-2 py-xl-1 me-2 me-sm-n4 me-md-n5 me-lg-0">
      <img alt="Soncollab Logo" class="d-block" src="/assets/images/logo/soncollablightlogo.svg" width="160">
    </a>

    <!-- Main navigation that turns into offcanvas on screens < 992px wide (lg breakpoint) -->
    <nav aria-labelledby="navbarNavLabel" class="offcanvas offcanvas-start green-low-gradient-for-aside" id="navbarNav"
         tabindex="-1">
      <div class="offcanvas-header py-3">
        <h5 class="offcanvas-title" id="navbarNavLabel">
          <img alt="Soncollab Logo" class="d-block" src="/assets/images/logo/soncollablightlogo.svg" width="160">
        </h5>
        <button aria-label="Close" class="btn-close" data-bs-dismiss="offcanvas" type="button"></button>
      </div>
      <div class="offcanvas-body pt-2 pb-4 py-lg-0 mx-lg-auto">
        <ul class="navbar-nav position-relative">
          <li class="nav-item py-lg-2 me-lg-n1 me-xl-0">
            <a [routerLinkActiveOptions]="{ exact: true }" [routerLinkActive]="['active']"
               [routerLink]="['/features']"
               class="nav-link">
              Caractéristiques
            </a>
          </li>

          <li class="nav-item dropdown py-lg-2 me-lg-n1 me-xl-0">
            <a aria-expanded="false" class="nav-link dropdown-toggle" data-bs-auto-close="outside" data-bs-toggle="dropdown" data-bs-trigger="hover"
               href="#" role="button">
              Produits
            </a>
            <ul class="dropdown-menu border-0 rounded-4 p-3 shadow bg-semi-dark">
              <li class="hover-effect-opacity px-2 mx-n2">
                <a class="dropdown-item dropdown-item-custom d-block mb-0"
                   [routerLinkActiveOptions]="{ exact: true }" [routerLinkActive]="['active']"
                   [routerLink]="['/products/studio']">
                  <span class="fw-lighter text-white">
                    Soncollab Studio
                  </span>
                </a>
              </li>
              <li class="hover-effect-opacity px-2 mx-n2">
                <a class="dropdown-item dropdown-item-custom d-block mb-0" [routerLinkActiveOptions]="{ exact: true }" [routerLinkActive]="['active']"
                   [routerLink]="['/products/connect']">
                  <span class="fw-lighter text-white">Soncollab Connect</span>
                </a>
              </li>
            </ul>
          </li>


          <li class="nav-item py-lg-2 me-lg-n2 me-xl-0">
            <a class="nav-link" [routerLinkActiveOptions]="{ exact: true }" [routerLinkActive]="['active']"
               [routerLink]="['/pricing']">
              Pricing
            </a>
          </li>

          <li class="nav-item dropdown py-lg-2 me-lg-n1 me-xl-0">
            <a aria-expanded="false" class="nav-link dropdown-toggle" data-bs-auto-close="outside" data-bs-toggle="dropdown" data-bs-trigger="hover"
               href="#" role="button">
              Resources
            </a>
            <ul class="dropdown-menu border-0 rounded-4 p-3 shadow bg-semi-dark">
              <li class="hover-effect-opacity px-2 mx-n2">
                <a class="dropdown-item dropdown-item-custom d-block mb-0" href="">
                  <span class="fw-lighter text-white">
                    Centre d'aide
                  </span>
                </a>
              </li>
              <li class="hover-effect-opacity px-2 mx-n2">
                <a class="dropdown-item dropdown-item-custom d-block mb-0" href="/connect">
                  <span class="fw-lighter text-white">
                    Documentation API
                  </span>
                </a>
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Button group -->
    <div class="d-flex gap-sm-1">

      <!-- Join button  -->
      <a class="btn btn-primary animate-scale" href="">
        <i class="fi-plus fs-lg animate-target ms-n2 me-1"></i>
        Démarrer
      </a>

    </div>
  </div>
</header>
