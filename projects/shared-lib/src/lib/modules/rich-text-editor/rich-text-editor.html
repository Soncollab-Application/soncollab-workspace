<div class="rich-text-editor-wrapper" [class.fullscreen]="isFullScreen()">
  <div class="card" [class.readonly-editor]="readonly">
    <div class="card-header d-flex flex-wrap align-items-center gap-1 p-2" [class.disabled-toolbar]="isPreview() && !isFullScreen()">
      @if (!readonly) {
        <div class="btn-group me-2 mb-1" role="group" [attr.aria-label]="'richTextEditorShared.textFormatting' | translate">
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            [class.active]="isBold()"
            (click)="applyFormat('bold')"
            [attr.title]="'richTextEditorShared.commands.bold' | translate"
            [disabled]="readonly">
            <i class="bi bi-type-bold"></i>
          </button>
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            [class.active]="isItalic()"
            (click)="applyFormat('italic')"
            [attr.title]="'richTextEditorShared.commands.italic' | translate"
            [disabled]="readonly">
            <i class="bi bi-type-italic"></i>
          </button>
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            [class.active]="isUnderline()"
            (click)="applyFormat('underline')"
            [attr.title]="'richTextEditorShared.commands.underline' | translate"
            [disabled]="readonly">
            <i class="bi bi-type-underline"></i>
          </button>
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            [class.active]="isStrike()"
            (click)="applyFormat('strikethrough')"
            [attr.title]="'richTextEditorShared.commands.strikethrough' | translate"
            [disabled]="readonly">
            <i class="bi bi-type-strikethrough"></i>
          </button>
        </div>

        <div class="btn-group me-2 mb-1" role="group" [attr.aria-label]="'richTextEditorShared.blocks' | translate">
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary dropdown-toggle"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            [disabled]="readonly">
            <i class="bi bi-type-h1"></i> {{ currentBlockTag() | translate }}
          </button>
          <ul class="dropdown-menu">
            @for (block of blockCommands; track block.command) {
              <li><a class="dropdown-item" href="javascript:void(0)" (click)="applyBlockFormat(block.command)">{{ block.translationKey | translate }}</a></li>
            }
          </ul>
        </div>

        <div class="btn-group me-2 mb-1" role="group" [attr.aria-label]="'richTextEditorShared.lists' | translate">
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            [class.active]="isUnorderedList()"
            (click)="applyFormat('insertUnorderedList')"
            [attr.title]="'richTextEditorShared.commands.bulletList' | translate"
            [disabled]="readonly">
            <i class="bi bi-list-ul"></i>
          </button>
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            [class.active]="isOrderedList()"
            (click)="applyFormat('insertOrderedList')"
            [attr.title]="'richTextEditorShared.commands.numberedList' | translate"
            [disabled]="readonly">
            <i class="bi bi-list-ol"></i>
          </button>
        </div>

        <div class="btn-group me-2 mb-1" role="group" [attr.aria-label]="'richTextEditorShared.linksAndMedia' | translate">
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            (click)="insertLink()"
            [attr.title]="'richTextEditorShared.commands.link' | translate"
            [disabled]="readonly">
            <i class="bi bi-link-45deg"></i>
          </button>
          @if (enableMediaPicker) {
            <button
              type="button"
              class="btn btn-sm btn-outline-secondary"
              (click)="insertImageFromMediaPicker()"
              [attr.title]="'richTextEditorShared.commands.image' | translate"
              [disabled]="readonly">
              <i class="bi bi-image"></i>
            </button>
          }
        </div>

        <div class="btn-group me-2 mb-1" role="group" [attr.aria-label]="'richTextEditorShared.alignment' | translate">
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            (click)="applyFormat('justifyLeft')"
            [attr.title]="'richTextEditorShared.commands.alignLeft' | translate"
            [disabled]="readonly">
            <i class="bi bi-text-left"></i>
          </button>
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            (click)="applyFormat('justifyCenter')"
            [attr.title]="'richTextEditorShared.commands.alignCenter' | translate"
            [disabled]="readonly">
            <i class="bi bi-text-center"></i>
          </button>
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            (click)="applyFormat('justifyRight')"
            [attr.title]="'richTextEditorShared.commands.alignRight' | translate"
            [disabled]="readonly">
            <i class="bi bi-text-right"></i>
          </button>
        </div>

        <div class="btn-group mb-1" role="group" [attr.aria-label]="'richTextEditorShared.actions' | translate">
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            (click)="applyFormat('undo')"
            [attr.title]="'richTextEditorShared.commands.undo' | translate"
            [disabled]="readonly">
            <i class="bi bi-arrow-counterclockwise"></i>
          </button>
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            (click)="applyFormat('redo')"
            [attr.title]="'richTextEditorShared.commands.redo' | translate"
            [disabled]="readonly">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
      }
    </div>

    <div
      #editorContent
      class="card-body border-secondary-subtle rounded-bottom p-3 editor-content"
      [hidden]="isPreview() && !isFullScreen()"
      [style.min-height]="minHeight"
      contenteditable="true"
      [attr.data-placeholder]="placeholder || ('richTextEditorShared.placeholders.editor' | translate)"
      (input)="onContentChanged()"
      (blur)="onTouched()"
      (mouseup)="updateButtonStates()"
      (keyup)="updateButtonStates()"
      (keydown)="onKeyDown($event)"
      [attr.readonly]="readonly ? true : null"
      role="textbox"
      [attr.aria-multiline]="true"
      [attr.aria-label]="'richTextEditorShared.toolbar' | translate"
    ></div>

    <div
      class="card-body border-secondary-subtle rounded-bottom p-3 editor-preview"
      [hidden]="!isPreview() && !isFullScreen()"
      [style.min-height]="minHeight"
      [innerHtml]="safeHtml()">
    </div>

    <div class="card-footer d-flex justify-content-end gap-2">
      @if (!readonly && !isFullScreen()) {
        <button
          type="button"
          class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1"
          (click)="togglePreview()"
          [attr.title]="isPreview() ? ('richTextEditorShared.commands.edit' | translate) : ('richTextEditorShared.commands.preview' | translate)">
          @if (!isPreview()) {
            <i class="bi bi-eye"></i>
            <span>{{ 'richTextEditorShared.commands.preview' | translate }}</span>
          } @else {
            <i class="bi bi-pencil-square"></i>
            <span>{{ 'richTextEditorShared.commands.edit' | translate }}</span>
          }
        </button>
      }

      <button
        type="button"
        class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 d-none d-md-inline-block"
        (click)="toggleFullScreen()"
        [attr.title]="isFullScreen() ? ('richTextEditorShared.commands.collapse' | translate) : ('richTextEditorShared.commands.expand' | translate)">
        @if (!isFullScreen()) {
          <i class="bi bi-arrows-angle-expand"></i>
          <span>{{ 'richTextEditorShared.commands.expand' | translate }}</span>
        } @else {
          <i class="bi bi-arrows-angle-contract"></i>
          <span>{{ 'richTextEditorShared.commands.collapse' | translate }}</span>
        }
      </button>
    </div>
  </div>
</div>
