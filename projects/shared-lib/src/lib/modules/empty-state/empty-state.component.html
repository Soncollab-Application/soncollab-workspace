<div class="text-center py-5">
  <div class="mb-3">
    <span [class]="'material-symbols-outlined display-4 text-muted opacity-25'">{{ icon() }}</span>
  </div>

  <h5 class="fw-semibold text-secondary mb-2">{{ title() }}</h5>

  @if (message()) {
    <p class="text-muted mb-4">{{ message() }}</p>
  }

  @if (actionLabel()) {
    <button type="button" class="btn btn-primary" (click)="onAction()">
      @if (actionIcon()) {
        <span class="material-symbols-outlined me-2">{{ actionIcon() }}</span>
      }
      {{ actionLabel() }}
    </button>
  }
</div>
