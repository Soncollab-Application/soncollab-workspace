<span [class]="getBadgeClasses()">
  @if (icon() && iconPosition() === 'left') {
    <span [class]="getIconClasses()">{{ icon() }}</span>
  }

  @if (text()) {
    {{ text() }}
  } @else {
    <ng-content />
  }

  @if (icon() && iconPosition() === 'right') {
    <span [class]="getIconClasses()">{{ icon() }}</span>
  }
</span>
