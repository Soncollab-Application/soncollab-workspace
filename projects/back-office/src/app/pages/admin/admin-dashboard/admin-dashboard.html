<div class="container py-5">
  <h1 class="mb-4">Test Data Card</h1>

  <lib-data-card
    [data]="contacts()"
    [columns]="columns()"
    [actions]="actions()"
    [loading]="loading()"
    [clickable]="true"
    [emptyStateTitle]="'Aucun contact'"
    [emptyStateMessage]="'Il n\'y a pas de contacts à afficher'"
    (cardClick)="onCardClick($event)"
    (actionClick)="onActionClick($event)"
  />
</div>
