<app-breadcrumb [showAvatar]="true" [icon]="'bi-people-fill'">
  <div breadcrumb-actions class="col-12 col-sm-auto mt-4 mt-sm-0 pb-5">
    @if (canCreateUser()) {
      <button class="btn btn-primary w-100 w-sm-auto" (click)="router.navigate(['/admin/team/users/new'])">
        <i class="bi bi-plus-lg me-2"></i>
        {{ 'users-list.newUser' | translate }}
      </button>
    }
  </div>
</app-breadcrumb>


<div class="mb-5 pt-2">
  <lib-filter-bar
    [filters]="filters()"
    [sortOptions]="sortOptions()"
    [selectedCount]="selectedCount()"
    [showSearch]="true"
    (searchChange)="onSearchChange($any($event))"
    (filterChange)="onFilterChange($any($event))"
    (sortChange)="onSortChange($any($event))"
  />
</div>


<div>
  <lib-data-table
    [data]="users()"
    [columns]="columns()"
    [actions]="actions()"
    [loading]="loading()"
    [pagination]="pagination()"
    [currentSort]="currentSort()"
    [selectable]="false"
    [clickable]="true"
    (sortChange)="onSortChange($any($event))"
    (pageChange)="onPageChange($any($event))"
    (actionClick)="onActionClick($any($event))"
    (rowClick)="onRowClick($any($event))"
  />
</div>
