<div class="row align-items-center py-3 mb-5">
  <div class="col">
    <h2 class="fs-5 for-inter-font fw-lighter mb-0">
      {{ currentTitle() }}
    </h2>
    <app-breadcrumb/>
  </div>
  @if (canCreateUser()) {
    <div class="col-auto">
      <button class="btn btn-primary" (click)="router.navigate(['/admin/team/users/new'])">
        <i class="bi bi-plus-lg me-2"></i>
        {{ 'users-list.newUser' | translate }}
      </button>
    </div>
  }
</div>

<div class="mb-5">
  <lib-filter-bar
    [filters]="filters()"
    [sortOptions]="sortOptions()"
    [selectedCount]="selectedCount()"
    [showSearch]="true"
    (searchChange)="onSearchChange($any($event))"
    (filterChange)="onFilterChange($any($event))"
    (sortChange)="onSortChange($any($event))"
  />
</div>


<div>
  <lib-data-table
    [data]="users()"
    [columns]="columns()"
    [actions]="actions()"
    [loading]="loading()"
    [pagination]="pagination()"
    [currentSort]="currentSort()"
    [selectable]="false"
    [clickable]="false"
    (sortChange)="onSortChange($any($event))"
    (pageChange)="onPageChange($any($event))"
    (actionClick)="onActionClick($any($event))"
    (rowClick)="onRowClick($any($event))"
  />
</div>
