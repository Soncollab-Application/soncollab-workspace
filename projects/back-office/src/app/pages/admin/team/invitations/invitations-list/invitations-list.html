<app-breadcrumb [showAvatar]="true" [icon]="'bi-envelope-fill'">
  <div breadcrumb-actions>
    @if (canCreateInvitation()) {
      <button class="btn btn-primary w-100" (click)="openInviteOffcanvas()">
        <i class="bi bi-plus-lg me-2"></i>
        {{ 'invitations.invite_member' | translate }}
      </button>
    }
  </div>

  <div breadcrumb-actions-mobile>
    @if (canCreateInvitation()) {
      <button class="btn btn-primary w-100" (click)="openInviteOffcanvas()">
        <i class="bi bi-plus-lg me-2"></i>
        {{ 'invitations.invite_member' | translate }}
      </button>
    }
  </div>
</app-breadcrumb>

<div class="mb-5 pt-2">
  <lib-filter-bar
    [filters]="filters()"
    [sortOptions]="sortOptions()"
    [showSearch]="true"
    [selectedCount]="-1"
    (searchChange)="onSearchChange($any($event))"
    (filterChange)="onFilterChange($any($event))"
    (sortChange)="onSortChange($any($event))"
  />
</div>

<div>
  <lib-data-table
    [data]="invitations()"
    [columns]="columns()"
    [actions]="actions()"
    [loading]="loading()"
    [pagination]="pagination()"
    [currentSort]="currentSort()"
    [selectable]="false"
    [clickable]="true"
    [emptyStateTitle]="emptyTitle()"
    [emptyStateMessage]="emptyMessage()"
    (sortChange)="onSortChange($any($event))"
    (pageChange)="onPageChange($any($event))"
    (actionClick)="onActionClick($any($event))"
    (rowClick)="onRowClick($any($event))"
  />
</div>

<app-invite-offcanvas />
