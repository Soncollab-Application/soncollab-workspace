
<h3 class="text-center fw-lighter mb-5 for-inter-font">
  {{ 'auth.login.title' | translate }}
</h3>

<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="needs-validation" novalidate>

  <!-- Email Field -->
  <div class="position-relative mb-4">
    <input
      type="email"
      class="form-control form-control-lg"
      [class.is-invalid]="isFieldInvalid('email')"
      formControlName="email"
      [placeholder]="'auth.login.email.placeholder' | translate"
      required>

    @if (emailError) {
      <div class="invalid-tooltip py-0">{{ emailError }}</div>
    }
  </div>

  <!-- Password Field -->
  <div class="mb-4">
    <div class="password-toggle">
      <input
        [type]="showPassword() ? 'text' : 'password'"
        class="form-control form-control-lg"
        [class.is-invalid]="isFieldInvalid('password')"
        formControlName="password"
        [placeholder]="'auth.login.password.placeholder' | translate"
        required>

      @if (passwordError) {
        <div class="invalid-tooltip py-0">{{ passwordError }}</div>
      }

      <label class="password-toggle-button fs-lg" [attr.aria-label]="'auth.login.password.toggleVisibility' | translate">
        <input type="checkbox" class="btn-check" (change)="togglePassword()">
        <span class="password-toggle-button-icon d-flex">
        @if (showPassword()) {
          <i class="bi bi-eye-slash"></i>
        } @else {
          <i class="bi bi-eye"></i>
        }
      </span>
      </label>
    </div>
  </div>

  <!-- Remember me & Forgot password -->
  <div class="d-flex align-items-center flex-wrap justify-content-between mb-4">
    <div class="form-check me-2">
      <input
        type="checkbox"
        class="form-check-input"
        id="remember-30"
        [checked]="rememberMe()"
        (change)="toggleRememberMe()">
      <label for="remember-30" class="form-check-label">
        {{ 'auth.login.rememberMe' | translate }}
      </label>
    </div>
    <div class="nav">
      <a class="nav-link text-info animate-underline p-0" routerLink="/auth/forgot-password">
        <span class="animate-target">{{ 'auth.login.forgotPassword' | translate }}</span>
      </a>
    </div>
  </div>

  <!-- Error Message -->
  @if (error()) {
    <div class="alert alert-danger mb-4" role="alert">
      {{ error() }}
    </div>
  }

  <!-- Submit Button -->
  <button
    type="submit"
    class="btn btn-lg btn-primary w-100"
    [disabled]="loading()">

    @if (loading()) {
      <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
    }

    {{ 'auth.login.signIn' | translate }}
  </button>

</form>
