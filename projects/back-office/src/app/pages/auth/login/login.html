<!-- Error Alert -->
@if (error()) {
  <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <div>{{ error() }}</div>
  </div>
}

<!-- Login Form -->
<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

  <!-- Email Field -->
  <div class="mb-3">
    <label for="email" class="form-label fw-medium">Email</label>
    <div class="input-group">
                <span class="input-group-text bg-light border-end-0">
                  <i class="bi bi-envelope text-muted"></i>
                </span>
      <input
        id="email"
        type="email"
        formControlName="identifier"
        class="form-control border-start-0 ps-0"
        [class.is-invalid]="emailError"
        placeholder="votre@email.com"
        autocomplete="email"
      />
    </div>
    @if (emailError) {
      <div class="invalid-feedback d-block">
        {{ emailError }}
      </div>
    }
  </div>

  <!-- Password Field -->
  <div class="mb-3">
    <label for="password" class="form-label fw-medium">Mot de passe</label>
    <div class="input-group">
                <span class="input-group-text bg-light border-end-0">
                  <i class="bi bi-lock text-muted"></i>
                </span>
      <input
        id="password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        class="form-control border-start-0 border-end-0 ps-0"
        [class.is-invalid]="passwordError"
        placeholder="••••••••"
        autocomplete="current-password"
      />
      <button
        type="button"
        class="btn btn-outline-light border-start-0"
        (click)="togglePassword()"
        [attr.aria-label]="showPassword() ? 'Cacher le mot de passe' : 'Afficher le mot de passe'"
      >
        @if (showPassword()) {
          <i class="bi bi-eye-slash text-muted"></i>
        } @else {
          <i class="bi bi-eye text-muted"></i>
        }
      </button>
    </div>
    @if (passwordError) {
      <div class="invalid-feedback d-block">
        {{ passwordError }}
      </div>
    }
  </div>

  <!-- Remember & Forgot -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="remember">
      <label class="form-check-label small" for="remember">
        Se souvenir de moi
      </label>
    </div>
    <a routerLink="/auth/forgot-password" class="small text-decoration-none">
      Mot de passe oublié ?
    </a>
  </div>

  <!-- Submit Button -->
  <button
    type="submit"
    class="btn btn-primary w-100 py-2 fw-medium"
    [disabled]="loading() || loginForm.invalid"
  >
    @if (loading()) {
      <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
      Connexion...
    } @else {
      Se connecter
    }
  </button>
</form>
