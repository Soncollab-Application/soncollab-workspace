@if (show()) {
  <div class="modal fade show d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.5);">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            {{ isFile() ? ('mediaLibrary.edit.fileTitle' | translate) : ('mediaLibrary.edit.folderTitle' | translate) }}
          </h5>
          <button type="button" class="btn-close" (click)="close.emit()"></button>
        </div>
        <div class="modal-body">

          @if (isFile()) {
            <div class="mb-3">
              <label class="form-label">{{ 'mediaLibrary.edit.fileName' | translate }}</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="editName">
            </div>

            <div class="mb-3">
              <label class="form-label">{{ 'mediaLibrary.edit.alternativeText' | translate }}</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="editAlternativeText"
                [placeholder]="'mediaLibrary.edit.alternativeTextPlaceholder' | translate">
            </div>

            <div class="mb-3">
              <label class="form-label">{{ 'mediaLibrary.edit.caption' | translate }}</label>
              <textarea
                class="form-control"
                rows="3"
                [(ngModel)]="editCaption"
                [placeholder]="'mediaLibrary.edit.captionPlaceholder' | translate"></textarea>
            </div>
          }

          @if (isFolder()) {
            <div class="mb-3">
              <label class="form-label">{{ 'mediaLibrary.edit.folderName' | translate }}</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="editName">
            </div>
          }
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            (click)="close.emit()"
            [disabled]="isSaving()">
            {{ 'common.cancel' | translate }}
          </button>
          <button
            type="button"
            class="btn btn-primary"
            [disabled]="!editName().trim() || isSaving()"
            (click)="save()">
            @if (isSaving()) {
              <span class="spinner-border spinner-border-sm me-2"></span>
            }
            {{ 'common.save' | translate }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
