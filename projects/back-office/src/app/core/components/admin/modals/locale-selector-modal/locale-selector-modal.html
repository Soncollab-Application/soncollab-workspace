@if (isOpen()) {
  <lib-modal
    size="default"
    [centered]="true"
    [backdrop]="'static'"
    [keyboard]="true"
    [showHeader]="true"
    [showFooter]="false"
    [closeLabel]="'common.close' | translate"
    ariaLabelledby="localeSelectorModalTitle">

    <div modal-header>
      <h5 id="localeSelectorModalTitle" class="modal-title d-flex align-items-center">
        <span class="material-symbols-outlined me-2 text-primary">translate</span>
        {{ 'locale_selector.title' | translate }}
      </h5>
    </div>

    <div>
      <p class="text-muted mb-3">{{ 'locale_selector.subtitle' | translate }}</p>

      @if (availableLocales().length === 0) {
        <div class="alert alert-info d-flex align-items-center">
          <span class="material-symbols-outlined me-2">info</span>
          {{ 'locale_selector.no_locales' | translate }}
        </div>
      } @else {
        <div class="list-group">
          @for (locale of availableLocales(); track locale.code) {
            <button
              type="button"
              class="list-group-item list-group-item-action d-flex align-items-center py-3"
              (click)="selectLocale(locale)">
              <span class="fs-3 me-3">{{ locale.flag }}</span>
              <div class="flex-grow-1">
                <div class="fw-semibold">{{ locale.label }}</div>
                <small class="text-muted">{{ locale.code.toUpperCase() }}</small>
              </div>
              <span class="material-symbols-outlined text-primary">arrow_forward</span>
            </button>
          }
        </div>
      }
    </div>
  </lib-modal>
}
