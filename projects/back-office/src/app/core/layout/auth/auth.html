<!-- auth.html -->
<div class="min-vh-100 d-flex flex-column">
  <!-- Header avec contrôles -->
  <header class="theming-custom py-3">
    <div class="container">
      <div class="d-flex justify-content-around align-items-center">

        <div class="">
          <a [routerLink]="['/auth/login']" aria-label="Soncollab Admin home"
             class="navbar-brand py-1 py-md-2 py-xl-1 me-2 me-sm-n4 me-md-n5 me-lg-0">

             <span class="d-none d-md-block d-sm-flex flex-shrink-0 text-primary rtl-flip me-2">
              <img [alt]="'Soncollab Logo - ' + (isDarkTheme() ? 'Dark Theme' : 'Light Theme')"
                   class="d-none d-md-block"
                   [src]="currentLogo()"
                   width="160">
            </span>

            <img [alt]="'Soncollab Mobile'"
                 class="d-block d-md-none rounded-2 logo-transition"
                 [src]="'/assets/images/logo/soncollab-mobile.png'"
                 width="38">
          </a>
        </div>

        <div class="d-flex gap-2 align-items-center">

          <div class="dropdown position-relative">
            <button type="button"
                    class="language-switcher btn btn-icon btn-outline-secondary fs-lg border-0 animate-scale"
                    data-bs-toggle="dropdown"
                    data-bs-display="static"
                    data-bs-auto-close="true"
                    aria-expanded="false">
          <span class="language-icon-active d-flex animate-target">
            <i class="fi-globe"></i>
          </span>
            </button>
            <ul class="dropdown-menu dropdown-menu-center"
                data-bs-popper="static">

              @for (lang of supportedLanguages(); track lang.code) {
                <li>
                  <button type="button"
                          class="dropdown-item d-flex align-items-center"
                          [class.active]="isLanguageActive(lang.code)"
                          (click)="setLanguage(lang.code)"
                          style="white-space: nowrap;">
                    <img [src]="lang.flagPath" width="16" height="16" class="me-2" alt="{{ lang.name }} Flag">
                    <span class="flex-grow-1">{{ lang.name }}</span>
                    @if (isLanguageActive(lang.code)) {
                      <i class="fi-check ms-2" style="flex-shrink: 0;"></i>
                    }
                  </button>
                </li>
              }
            </ul>
          </div>


          <div class="dropdown position-relative">
            <button type="button"
                    class="theme-switcher btn btn-icon btn-outline-secondary fs-lg border-0 animate-scale"
                    data-bs-toggle="dropdown"
                    data-bs-display="static"
                    data-bs-auto-close="true"
                    aria-expanded="false">
          <span class="theme-icon-active d-flex animate-target">
            <i [class]="getActiveThemeIcon()"></i>
          </span>
            </button>
            <ul class="dropdown-menu dropdown-menu-center"
                data-bs-popper="static">

              <!-- Light Theme -->
              <li>
                <button type="button"
                        class="dropdown-item d-flex align-items-center"
                        [class.active]="isThemeActive('light')"
                        [attr.aria-pressed]="isThemeActive('light')"
                        (click)="setTheme('light')">
              <span class="theme-icon d-flex fs-base me-2">
                <i class="fi-sun"></i>
              </span>
                  <span class="theme-label flex-grow-1">{{ 'theme.light' | translate }}</span>
                  <i class="item-active-indicator fi-check ms-auto"
                     [style.opacity]="isThemeActive('light') ? '1' : '0'"></i>
                </button>
              </li>

              <!-- Dark Theme -->
              <li>
                <button type="button"
                        class="dropdown-item d-flex align-items-center"
                        [class.active]="isThemeActive('dark')"
                        [attr.aria-pressed]="isThemeActive('dark')"
                        (click)="setTheme('dark')">
              <span class="theme-icon d-flex fs-base me-2">
                <i class="fi-moon"></i>
              </span>
                  <span class="theme-label flex-grow-1">{{ 'theme.dark' | translate }}</span>
                  <i class="item-active-indicator fi-check ms-auto"
                     [style.opacity]="isThemeActive('dark') ? '1' : '0'"></i>
                </button>
              </li>

              <!-- Auto Theme -->
              <li>
                <button type="button"
                        class="dropdown-item d-flex align-items-center"
                        [class.active]="isThemeActive('auto')"
                        [attr.aria-pressed]="isThemeActive('auto')"
                        (click)="setTheme('auto')">
              <span class="theme-icon d-flex fs-base me-2">
                <i class="fi-monitor"></i>
              </span>
                  <span class="theme-label flex-grow-1">{{ 'theme.auto' | translate }}</span>
                  <i class="item-active-indicator fi-check ms-auto"
                     [style.opacity]="isThemeActive('auto') ? '1' : '0'"></i>
                </button>
              </li>
            </ul>
          </div>
        </div>

      </div>
    </div>
  </header>

  <main class="flex-grow-1 d-flex mt-0 align-items-center">
    <div class="container">

      <div class="mb-0">
        <h3 class="text-center for-inter-font">
          {{ 'auth.admin.title' | translate }}
        </h3>

        <p class="text-center fs-5 text-muted fw-lighter for-inter-tight-font  mb-4">
          {{ 'auth.admin.subtitle' | translate }}
        </p>
      </div>

      <div class="row justify-content-center">
        <div class="col-12 col-sm-12 col-md-10 col-lg-6 col-xl-5">
          <hr class="py-1">
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center">
    <div class="container">
      <div class="text-muted small">
        <div class="d-flex flex-column flex-md-row justify-content-center align-items-center">
          <span class="mb-1 mb-md-0">© {{ currentYear }} Soncollab.</span>

          <div class="d-flex flex-column flex-sm-row align-items-center">
            <span class="d-none d-md-inline mx-2">|</span>
            <a
              [href]="environment.app.url + '/company/privacy-policy'"
              target="_blank"
              class="text-decoration-none me-sm-2 mb-1 mb-sm-0">
              {{ 'auth.footer.privacy' | translate }}
            </a>
            <span class="d-none d-sm-inline mx-1">|</span>
            <a
              [href]="environment.app.url + '/company/use-condition'"
              target="_blank"
              class="text-decoration-none">
              {{ 'auth.footer.terms' | translate }}
            </a>
          </div>
        </div>
      </div>
    </div>
  </footer>

</div>
