apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: soncollab-frontend-ingress
  namespace: soncollab
  labels:
    app: soncollab-frontend
    environment: production
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/use-gzip: "true"
    nginx.ingress.kubernetes.io/gzip-types: "text/plain,text/css,application/json,application/javascript,text/xml,application/xml,application/xml+rss,text/javascript"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;" always;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - soncollab.com
        - www.soncollab.com
      secretName: soncollab-frontend-tls
  rules:
    - host: soncollab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: soncollab-frontend-service
                port:
                  number: 80
    - host: www.soncollab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: soncollab-frontend-service
                port:
                  number: 80
