---
apiVersion: v1
kind: ConfigMap
metadata:
  name: soncollab-back-office-config-staging
  namespace: soncollab-staging
  labels:
    app: soncollab-back-office
    environment: staging
data:
  # Application configuration
  NODE_ENV: "staging"
  APP_NAME: "Soncollab Staging"
  APP_VERSION: "1.0.0-staging"

  # API configuration
  API_BASE_URL: "https://stg-api.soncollab.com"
  API_TIMEOUT: "30000"

  # Feature flags
  ENABLE_ANALYTICS: "false"
  ENABLE_PWA: "false"
  ENABLE_I18N: "true"

  # Performance settings
  CACHE_DURATION: "300"
  MAX_RETRIES: "1"
