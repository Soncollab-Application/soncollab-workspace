apiVersion: v1
kind: Pod
metadata:
  name: security-context-demo
  namespace: soncollab
  labels:
    app: soncollab-frontend
spec:
  serviceAccountName: soncollab-frontend-sa
  securityContext:
    # Run as non-root user
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    # Set security options
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: soncollab-frontend
      image: rg.soncollab.com/staging/soncollab-frontend:latest
      securityContext:
        # Container-level security
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 101
        capabilities:
          drop:
            - ALL
          add:
            - NET_BIND_SERVICE
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: var-cache-nginx
          mountPath: /var/cache/nginx
        - name: var-run
          mountPath: /var/run
  volumes:
    - name: tmp-volume
      emptyDir: {}
    - name: var-cache-nginx
      emptyDir: {}
    - name: var-run
      emptyDir: {}
